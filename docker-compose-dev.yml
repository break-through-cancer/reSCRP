services:
  scrp:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu

    # ✅ Load environment variables directly from your .env file
    env_file:
      - .env

    command: npm run start-with-hot-reload

    develop:
      watch:
        - action: sync
          path: .
          target: /scrp
          ignore:
            - node_modules/
            - data/
        - action: rebuild
          path: package.json

    ports:
      - "3001:3000"

    volumes:
      - ./public/DataDownload:/scrp/public/DataDownload

    # ✅ You can remove this whole section if .env is correct,
    # but if you prefer to keep it explicit, it’s still fine.
    environment:
      SSL_KEY: ${SSL_KEY}
      SSL_CA: ${SSL_CERT}
      SSL_CERT: ${SSL_CA}
      SSL_PASSPHRASE: ${SSL_PASSPHRASE}

  db:
    image: mariadb:latest
    container_name: scrp-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - ./data:/data
      - ./data/db:/var/lib/mysql:Z
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    environment:
      MARIADB_DATABASE: tcm
      MARIADB_ROOT_PASSWORD: test

